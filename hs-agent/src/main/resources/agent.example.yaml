# HushSign agent configuration (P1-S10). Every key can be overridden with an
# environment variable (HS_ + underscored path): HS_GATEWAY_ID,
# HS_KAFKA_BOOTSTRAP_SERVERS, HS_MODEMS_PORTS, HS_DEDUPE_MAX_ENTRIES, ...
# Secrets (SASL password) must come from the environment, never from this file.
#
# Logging identifiers: the agent writes agent-clean.log (scrubbed) and, only when asked,
# agent.log with raw IMSI / MSISDN / ICCID. That is an environment setting rather than a key
# here, because logging starts before this file is read:
#
#   HS_AGENT_LOG_IDENTIFIERS=masked   default; agent.log is not written at all
#   HS_AGENT_LOG_IDENTIFIERS=raw      agent.log carries raw identities (owner-only file)

gatewayId: 4f2c9c1e-0f4e-4f36-9d43-2f0a4a6b1c11   # the uuid the fleet registry assigned to this gateway
operators: ["226-10"]
workDir: .

kafka:
  bootstrapServers: localhost:9092
  clientId: gw-buc-01
  security:
    protocol: PLAINTEXT        # PLAINTEXT | SSL | SASL_PLAINTEXT | SASL_SSL
    saslMechanism: SCRAM-SHA-512
    saslUsername: gw-226-10
    # saslPassword: set HS_KAFKA_SECURITY_SASL_PASSWORD
    truststorePath: ""
    # truststorePassword: set HS_KAFKA_SECURITY_TRUSTSTORE_PASSWORD (only for SSL/SASL_SSL)

modems:
  # Pin the port on a real gateway. A Huawei-class dongle exposes three ttyUSB interfaces and
  # only one answers AT, so scanning wastes time on the others at every start.
  #
  # Use the by-id link, not /dev/ttyUSB0. A dongle that resets - a brown-out during transmit is
  # common on a shared or switched USB port - comes back with a different ttyUSB number, and a
  # pinned /dev/ttyUSB0 then points at the wrong interface or at nothing:
  #
  #   ls -l /dev/serial/by-id/
  #     usb-HUAWEI_Technology_HUAWEI_Mobile-if00-port0 -> ../../ttyUSB1
  #
  #   autoScan: false
  #   ports: ["/dev/serial/by-id/usb-HUAWEI_Technology_HUAWEI_Mobile-if00-port0"]
  #
  # Leave autoScan true only while bringing a host up and finding out which interface is the AT
  # one; it is a convenience, not a deployment setting.
  autoScan: true
  ports: []                    # when autoScan is false: device paths
  baudRate: 115200
  responseTimeoutMs: 30000
  commandWaitMs: 700
  pollWaitMs: 200
  probeAttempts: 3
  maxConsecutiveErrors: 3
  # "FULL_HEX" is the standard AT+CMGS form. Huawei K3765-family firmware
  # rejects it with +CMS ERROR: 304 and needs "TPDU_HEX" (P1-S14).
  pduSubmission: FULL_HEX
  # simPin: set HS_MODEMS_SIM_PIN â€” never commit a PIN to this file

heartbeat:
  intervalSeconds: 30

dedupe:
  maxEntries: 10000

spool:
  path: spool
  maxBytes: 67108864           # 64 MiB; the spool refuses new records above this
                               # rather than filling the SD card or dropping evidence

policy:
  path: policy.yaml
