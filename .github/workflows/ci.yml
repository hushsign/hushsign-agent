name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw -B verify --no-transfer-progress

  protocol-schemas:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Vendored schemas match the vendored manifest
        run: bash scripts/check-protocol-drift.sh protocol/src/main/resources/protocol/schemas

  audit-tamper:
    # P7-S10: the audit chain is the device's evidence, so "it detects tampering" is a gate of
    # its own rather than a case inside the general suite, where a refactor could drop it.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: An edited, deleted or reordered entry must break the chain
        run: ./mvnw -B -pl hs-agent -Dtest=FileAuditChainTest,AuditCliTest test --no-transfer-progress

  protocol-drift:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Detect platform repo token
        id: detect
        env:
          PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          if [ -n "$PLATFORM_REPO_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out hushsign-platform (canonical protocol)
        if: ${{ steps.detect.outputs.has_token == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: actions/checkout@v4
        with:
          repository: hushsign/hushsign-platform
          ref: main
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: platform-checkout
      - name: Full cross-repo drift check
        if: ${{ steps.detect.outputs.has_token == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        run: bash platform-checkout/libs/protocol/scripts/check-agent-protocol-drift.sh .
      - name: Cross-repo drift check skipped
        if: ${{ steps.detect.outputs.has_token != 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: echo "Cross-repo drift check skipped (PLATFORM_REPO_TOKEN not set or fork PR); the platform repo's CI gates drift on its side."
