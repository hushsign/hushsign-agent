# SonarQube analysis of the edge agent (reproducible).
#
#   sonar-scanner -Dsonar.host.url=http://<server>:9000 -Dsonar.token=<token>
#
# protocol/ is a vendored copy of the platform's canonical module: it is analysed here
# because it ships in this repository, but a finding in it is fixed in the platform first
# and then copied over (see the drift check in docs/todo.txt).

sonar.projectKey=hushsign-agent
sonar.projectName=HushSign Agent
sonar.projectVersion=0.1.0-SNAPSHOT

sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes

sonar.exclusions=\
  **/target/**,**/*.min.js,**/*.min.css

sonar.cpd.exclusions=\
  **/src/test/**,**/protocol/src/main/resources/protocol/**
